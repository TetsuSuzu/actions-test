name: Hello Actions Test

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  hosted:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show runner message
        run: echo "GitHub-hosted runner on github.com works"

      - name: Inspect repository
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Runner OS: $RUNNER_OS"
          pwd
          ls -la

      - name: Run CI test
        run: |
          test -f .github/workflows/hello.yml
          echo "CI test passed"